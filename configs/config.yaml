
data:
  path: "data/"
  sampling_rate: 100
  window_size: 250
  stride: 125
  superclasses: ["NORM", "MI", "STTC", "CD", "HYP"]

training:
  batch_size: 64
  batch_size_full: 32      # for HuBERT-ECG (full records)
  epochs: 3             # set to 3 for quick testing, increase for better performance
  lr_peft: 0.0003
  lr_pretrained: 0.0001    # lower for pretrained models
  weight_decay: 0.01
  grad_clip: 1.0
  num_workers: 0           # 0 for Windows, 4 for Linux

model:
  hubert_size: "base"
  hubert_blocks_to_unfreeze: [4, 8]
  hubert_peft:
    target_modules: ["q_proj", "v_proj", "k_proj", "out_proj"]
    lora_rank: [4, 8]
    lora_alpha_multiplier: 1
    use_dora: [false, true]
  leadwise:
    d_model: 128
    num_temporal_layers: 3
    num_heads: 8
    num_cross_heads: 4
    dropout: 0.1
    head_dropout: 0.2
    patch_length: 25
    patch_stride: 25

paths:
  results: "results/"
  checkpoints: "results/checkpoints/"
  notebooks: "notebooks/"
  models: "results/models/"
  figures: "results/figures/"
  logs: "results/logs/"

inference:
  threshold: 0.5

baseline:
  dummy_strategy: "prior"