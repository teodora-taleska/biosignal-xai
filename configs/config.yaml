
data:
  path: "data/"
  sampling_rate: 100
  window_size: 250
  stride: 125
  superclasses: ["NORM", "MI", "STTC", "CD", "HYP"]

training:
  batch_size: 64
  batch_size_full: 32
  epochs: 15
  lr_pretrained: 0.0001
  weight_decay: 0.01
  grad_clip: 1.0
  num_workers: 0           # 0 for Windows, 4 for Linux

model:
  hubert_size: base
  leadwise:
    d_model: 128
    num_temporal_layers: 3
    num_heads: 8
    num_cross_heads: 4
    dropout: 0.1
    head_dropout: 0.2
    patch_length: 25
    patch_stride: 25

paths:
  results: "results/"
  checkpoints: "results/checkpoints/"
  notebooks: "notebooks/"
  models: "results/models/"
  figures: "results/figures/"
  logs: "results/logs/"

inference:
  threshold: 0.5

explainability:
  uncertainty_threshold: 0.5